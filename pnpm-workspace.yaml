packages:
  - packages/*

catalog:
  '@testing-library/jest-dom': ^8.0.0
  '@testing-library/user-event': ^14.6.13
  '@vitest/browser': ^5.1.1
  eslint: ^10.15.0
  eslint-config-ts-prefixer: ^5.1.0
  globals: ^17.14.0
  happy-dom: ^21.0.4
  playwright: ^1.65.1
  typescript: ^7.0.2
  typescript-eslint: ^8.74.0
  vitest: ^5.1.1
  zod: 4.6.7

# Supply-chain security (migrated from .npmrc 2026-05-07)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - next
  - react
  - react-dom
  - '@types/react'
  - '@types/react-dom'
  - typescript
  - vite
  - vitest
  - '@vitejs/plugin-react'
  - eslint
  - prettier
  - tailwindcss
  - '@tanstack/react-query'
  - zod
  - react-hook-form
  - eslint-config-ts-prefixer
  - '@laststance/redux-storage-middleware'
  - '@laststance/react-next-eslint-plugin'

onlyBuiltDependencies:
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - esbuild
  - msw
  - prisma
  - sharp
  - unrs-resolver

overrides:
  'follow-redirects@<1.16.2': '1.16.2'
verifyStoreIntegrity: true
